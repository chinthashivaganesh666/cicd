name: ci/cd pipeline to deploy to tomcat
on:
   push:
      branches: master
jobs:
   build-deploy:
     runs-on: ubuntu-latest
     steps: 
        - name: checkout code
          uses: actions/checkout@v3
        - name: set-up jdk
          uses: actions/setup-java@v3
          with:
            distribution: temurin
            java-version: '17'
            cache: maven
            
        - name: validate with maven
          run: mvn validate
        - name: compile with maven
          run: mvn compile
        - name: test with maven
          run: mvn test
        - name: package with maven
          run: mvn package
        - name: verify war file
          run: ls -lh target/
          # deploy to tomcat
        - name: sonarQube scan
          env:
             SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
             SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          run: |
             mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
               -Dsonar.projectKey=train \
               -Dsonar.projectName=TrainBook \
               -Dsonar.host.url="$SONAR_HOST_URL" \
               -Dsonar.token="$SONAR_TOKEN"
            
            
         
