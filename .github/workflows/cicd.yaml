name: ci/cd pipeline to deploy to tomcat
on:
   push:
      branches: master
      
   workflow_dispatch:

jobs:
   build-deploy:
     runs-on: ubuntu-latest
     steps: 
        - name: checkout code
          uses: actions/checkout@v3
        - name: set-up jdk
          uses: actions/setup-java@v3
          with:
            distribution: temurin
            java-version: '17'
            cache: maven
            
        - name: validate with maven
          run: mvn validate
        - name: compile with maven
          run: mvn compile
        - name: test with maven
          run: mvn test
        - name: package with maven
          run: mvn package
        - name: verify war file
          run: ls -lh target/
          # deploy to tomcat
        - name: setup java 8 again
          uses: actions/setup-java@v4
          with:
           distribution: temurin
           java-version: '8'
        - name: configure maven settings.xml
          run: |
            mkdir -p ~/.m2
            cat > ~/.m2/settings.xml  <<EOF
            <settings>
             <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
             </servers>
            </settings>
               EOF
        - name: deploy artifact to nexus
          run: |
            mvn deploy \
              -DskipTests \
              -DaltDeploymentRepository=nexus::default::${{ secrets.NEXUS_REPO_URL }}

        
          
            
            
         
